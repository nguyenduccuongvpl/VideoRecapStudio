[project]
name = "video_recap"
version = "0.1.0"
description = "Desktop application to auto-generate video recap/review from a source video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
core = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]
ai = [
    "openai>=1.12.0",
    "google-generativeai>=0.3.2",
]
media = [
    "ffmpeg-python>=0.2.0",
    "scenedetect>=0.6.2",
]
desktop = [
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "tests"]
